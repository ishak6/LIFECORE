name: LIFECORE Android CI

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecore-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit test and emulator UI test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Build debug APK, run unit tests and lint
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --refresh-dependencies :app:assembleDebug :app:testDebugUnitTest :app:lintDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM access
        run: |
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run Compose UI tests and verify fresh app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.lifecore.app
            adb shell am start -W -n com.lifecore.app/.MainActivity
            sleep 5
            mkdir -p app/build/qa-evidence
            adb logcat -d -v time > app/build/qa-evidence/logcat.txt
            adb shell screencap -p /sdcard/lifecore-home.png
            adb pull /sdcard/lifecore-home.png app/build/qa-evidence/home-screen.png

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecore-ui-qa-evidence
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/qa-evidence/**
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecore-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
