name: LIFECORE Android CI

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifecore-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - name: Build debug APK and run unit tests
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --refresh-dependencies :app:assembleDebug :app:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifecore-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
